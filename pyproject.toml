[project]
name = "your-discord-connect"
version = "1.0.0"
description = "Discord server members as Home Assistant devices"
requires-python = ">=3.14.2"
dependencies = ["discord.py==2.7.1", "PyNaCl==1.6.2", "davey==0.2.0"]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375", "ruff==0.14.5", "ha-ffmpeg==3.2.2", "mutagen==1.48.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
# Match Home Assistant 2026.10.4's prebuilt CFFI backend.
constraint-dependencies = ["cffi==2.0.0"]
