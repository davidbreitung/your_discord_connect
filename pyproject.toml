[project]
name = "your-discord-connect"
version = "0.1.0"
description = "Discord server members as Home Assistant devices"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375", "ruff==0.14.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
